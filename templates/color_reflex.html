<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Color Reflex Challenge</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
        }

        .game-box {
            max-width: 700px;
            margin: 50px auto;
            padding: 40px;
            background: #1e293b;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 0 25px #38bdf8;
        }

        h1 {
            color: #38bdf8;
            font-weight: bold;
        }

        #colorBox {
            width: 250px;
            height: 180px;
            margin: 30px auto;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: bold;
            cursor: pointer;
            background: #475569;
            user-select: none;
        }

        .option {
            min-width: 120px;
            margin: 5px;
        }

        #message {
            min-height: 35px;
            margin-top: 20px;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="game-box">

        <h1>🎨 Color Reflex Challenge</h1>

        <p class="text-secondary">
            Click the button that matches the displayed color.
        </p>

        <h5>
            Score:
            <span id="score">0</span>
            &nbsp; | &nbsp;
            Round:
            <span id="round">0</span>/10
        </h5>

        <div id="colorBox">
            START
        </div>

        <div id="options"></div>

        <div id="message"></div>

        <button
            id="startButton"
            onclick="startGame()"
            class="btn btn-success btn-lg mt-3"
        >
            ▶ Start Game
        </button>

        <div class="mt-4">

            <a
                href="/games"
                class="btn btn-outline-light"
            >
                ⬅ Back to Games
            </a>

        </div>

    </div>

</div>


<script>

const colors = [
    "Red",
    "Blue",
    "Green",
    "Yellow",
    "Purple",
    "Orange"
];


const colorCodes = {
    Red: "#ef4444",
    Blue: "#3b82f6",
    Green: "#22c55e",
    Yellow: "#eab308",
    Purple: "#a855f7",
    Orange: "#f97316"
};


let currentColor = "";

let score = 0;

let round = 0;

let gameStarted = false;


function startGame() {

    score = 0;

    round = 0;

    gameStarted = true;

    document.getElementById("score").innerHTML = score;

    document.getElementById("startButton").disabled = true;

    document.getElementById("message").innerHTML = "";

    nextRound();

}


function nextRound() {

    if (round >= 10) {

        finishGame();

        return;

    }


    round++;

    document.getElementById("round").innerHTML = round;


    currentColor =
        colors[Math.floor(Math.random() * colors.length)];


    const colorBox =
        document.getElementById("colorBox");


    colorBox.style.background =
        colorCodes[currentColor];


    colorBox.innerHTML =
        currentColor;


    createOptions();

}


function createOptions() {

    const options =
        document.getElementById("options");

    options.innerHTML = "";


    let shuffled =
        [...colors].sort(() => Math.random() - 0.5);


    shuffled.slice(0, 4).forEach(function(color) {

        const button =
            document.createElement("button");


        button.className =
            "btn btn-outline-light option";


        button.innerHTML =
            color;


        button.onclick = function() {

            checkAnswer(color);

        };


        options.appendChild(button);

    });

}


function checkAnswer(selectedColor) {

    if (selectedColor === currentColor) {

        score++;

        document.getElementById("score").innerHTML =
            score;

        document.getElementById("message").innerHTML =
            "✅ Correct!";

        document.getElementById("message").style.color =
            "#22c55e";

    } else {

        document.getElementById("message").innerHTML =
            "❌ Wrong! Correct answer: " + currentColor;

        document.getElementById("message").style.color =
            "#ef4444";

    }


    setTimeout(function() {

        nextRound();

    }, 700);

}


function finishGame() {

    gameStarted = false;

    document.getElementById("colorBox").innerHTML =
        "🎉 FINISHED!";

    document.getElementById("colorBox").style.background =
        "#2563eb";

    document.getElementById("options").innerHTML = "";

    document.getElementById("message").innerHTML =
        "Your final score: " + score + "/10";

    document.getElementById("message").style.color =
        "#facc15";

    document.getElementById("startButton").disabled =
        false;

    document.getElementById("startButton").innerHTML =
        "🔄 Play Again";

}


</script>

</body>

</html>
