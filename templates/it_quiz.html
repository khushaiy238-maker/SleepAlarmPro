<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IT Quiz Challenge</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#0f172a;
color:white;
font-family:Arial;
}

.quiz-box{
max-width:800px;
margin:50px auto;
background:#1e293b;
padding:40px;
border-radius:20px;
box-shadow:0 0 25px #38bdf8;
}

button{
margin-top:20px;
}

</style>

</head>

<body>

<div class="quiz-box">

<h2 class="text-center mb-4">
💻 IT Quiz Challenge
</h2>

<h4 id="question"></h4>

<div id="answers" class="mt-4"></div>

<h5 class="mt-4">
Score :
<span id="score">0</span>
</h5>

<button class="btn btn-primary" onclick="nextQuestion()">
Next Question
</button>

<a href="/games" class="btn btn-secondary">
Back
</a>

</div>

<script>

const quiz=[

{
q:"What does CPU stand for?",
a:["Central Processing Unit","Computer Personal Unit","Central Program Utility","Computer Process Unit"],
c:0
},

{
q:"Which language is used with Flask?",
a:["Java","Python","PHP","C#"],
c:1
},

{
q:"Which database are you using in this project?",
a:["MongoDB","Oracle","MySQL","Firebase"],
c:2
},

{
q:"HTML stands for?",
a:[
"Hyper Text Markup Language",
"High Text Machine Language",
"Hyper Transfer Markup Language",
"Home Tool Markup Language"
],
c:0
},

{
q:"CSS is used for?",
a:[
"Database",
"Styling",
"Programming",
"Networking"
],
c:1
},

{
q:"Which company developed Python?",
a:[
"Google",
"Microsoft",
"Python Software Foundation",
"Apple"
],
c:2
},

{
q:"SQL is mainly used for?",
a:[
"Gaming",
"Database",
"Animation",
"AI"
],
c:1
},

{
q:"What does AI mean?",
a:[
"Artificial Intelligence",
"Automatic Internet",
"Advanced Interface",
"Artificial Internet"
],
c:0
},

{
q:"Which protocol loads websites?",
a:[
"FTP",
"HTTP",
"SMTP",
"SSH"
],
c:1
},

{
q:"Which one is a programming language?",
a:[
"Python",
"Chrome",
"Windows",
"Google"
],
c:0
}

];

let current=0;

let score=0;

function loadQuestion(){

document.getElementById("question").innerHTML=(current+1)+". "+quiz[current].q;

let html="";

quiz[current].a.forEach((ans,index)=>{

html+=`
<button class="btn btn-outline-info w-100 mt-2"
onclick="checkAnswer(${index})">
${ans}
</button>
`;

});

document.getElementById("answers").innerHTML=html;

}

function checkAnswer(index){

if(index==quiz[current].c){

score++;

document.getElementById("score").innerHTML=score;

}

}

function nextQuestion(){

current++;

if(current>=quiz.length){

document.querySelector(".quiz-box").innerHTML=`

<h1 class="text-center">
🎉 Quiz Completed
</h1>

<h2 class="text-center mt-4">
Your Score : ${score}/${quiz.length}
</h2>

<div class="text-center mt-5">

<a href="/it_quiz" class="btn btn-success">
Restart Quiz
</a>

<a href="/games" class="btn btn-secondary">
Back to Games
</a>

</div>

`;

return;

}

loadQuestion();

}

loadQuestion();

</script>

</body>

</html>
