<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Memory Match</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#0f172a;
    color:white;
    text-align:center;
    font-family:Arial;
}

h1{
    margin-top:30px;
    color:#38bdf8;
}

#gameBoard{
    width:420px;
    margin:30px auto;
    display:grid;
    grid-template-columns:repeat(4,90px);
    gap:10px;
}

.card{

    height:90px;

    background:#1e293b;

    border-radius:12px;

    cursor:pointer;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:35px;

    color:transparent;

    transition:.3s;

}

.card.open{

    background:#38bdf8;

    color:white;

}

.card.matched{

    background:#22c55e;

    color:white;

}

button{

    margin-top:20px;

}

</style>

</head>

<body>

<h1>🧠 Memory Match</h1>

<h4>Moves :
<span id="moves">0</span>
</h4>

<div id="gameBoard"></div>

<a href="/games" class="btn btn-secondary mt-4">
⬅ Back
</a>

<button onclick="location.reload()" class="btn btn-warning mt-4">
Restart
</button>

<script>

const emojis=[
'💻','💻',
'🖱','🖱',
'⌨️','⌨️',
'🌐','🌐',
'📱','📱',
'🤖','🤖',
'💾','💾',
'🧠','🧠'
];

emojis.sort(()=>Math.random()-0.5);

const board=document.getElementById("gameBoard");

let first=null;

let second=null;

let lock=false;

let moves=0;

emojis.forEach((emoji)=>{

let card=document.createElement("div");

card.className="card";

card.innerHTML=emoji;

card.onclick=function(){

if(lock) return;

if(card.classList.contains("matched")) return;

if(card===first) return;

card.classList.add("open");

if(!first){

first=card;

return;

}

second=card;

moves++;

document.getElementById("moves").innerHTML=moves;

if(first.innerHTML===second.innerHTML){

first.classList.add("matched");

second.classList.add("matched");

first=null;

second=null;

checkWin();

}else{

lock=true;

setTimeout(()=>{

first.classList.remove("open");

second.classList.remove("open");

first=null;

second=null;

lock=false;

},700);

}

};

board.appendChild(card);

});

function checkWin(){

let matched=document.querySelectorAll(".matched");

if(matched.length===16){

setTimeout(()=>{

alert("🎉 Congratulations!\nYou completed the Memory Match Game.");

},300);

}

}

</script>

</body>

</html>
