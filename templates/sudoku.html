<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>IT Brain Sudoku</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            text-align: center;
            padding: 25px;
        }

        h1 {
            color: #38bdf8;
            font-size: 38px;
        }

        .subtitle {
            color: #cbd5e1;
            margin-bottom: 25px;
        }

        #sudoku {
            width: 450px;
            height: 450px;

            margin: 20px auto;

            display: grid;
            grid-template-columns: repeat(9, 1fr);

            border: 3px solid white;
        }

        .cell {
            width: 50px;
            height: 50px;

            background: #1e293b;

            color: white;

            border: 1px solid #64748b;

            text-align: center;

            font-size: 20px;

            outline: none;
        }

        .cell:focus {
            background: #334155;
        }

        .right-border {
            border-right: 3px solid white;
        }

        .bottom-border {
            border-bottom: 3px solid white;
        }

        .buttons {
            margin-top: 20px;
        }

        button {
            padding: 12px 22px;

            border: none;

            border-radius: 8px;

            font-size: 16px;

            cursor: pointer;

            margin: 5px;
        }

        .check {
            background: #16a34a;
            color: white;
        }

        .clear {
            background: #dc2626;
            color: white;
        }

        .back {
            display: inline-block;

            margin-top: 20px;

            padding: 12px 25px;

            border: 1px solid white;

            border-radius: 8px;

            color: white;

            text-decoration: none;
        }

        #message {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        @media(max-width:550px) {

            #sudoku {
                width: 324px;
                height: 324px;
            }

            .cell {
                width: 36px;
                height: 36px;
                font-size: 16px;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <h1>🔢 IT Brain Sudoku</h1>

    <p class="subtitle">
        Train your logical thinking and concentration.
    </p>

    <div id="sudoku"></div>

    <div class="buttons">

        <button class="check"
                onclick="checkSudoku()">

            ✅ Check

        </button>

        <button class="clear"
                onclick="clearBoard()">

            🗑 Clear

        </button>

    </div>

    <div id="message"></div>

    <a href="{{ url_for('games') }}"
       class="back">

        ← Back to Games

    </a>

</div>


<script>

const puzzle = [

    [5,3,0,0,7,0,0,0,0],
    [6,0,0,1,9,5,0,0,0],
    [0,9,8,0,0,0,0,6,0],

    [8,0,0,0,6,0,0,0,3],
    [4,0,0,8,0,3,0,0,1],
    [7,0,0,0,2,0,0,0,6],

    [0,6,0,0,0,0,2,8,0],
    [0,0,0,4,1,9,0,0,5],
    [0,0,0,0,8,0,0,7,9]

];


const solution = [

    [5,3,4,6,7,8,9,1,2],
    [6,7,2,1,9,5,3,4,8],
    [1,9,8,3,4,2,5,6,7],

    [8,5,9,7,6,1,4,2,3],
    [4,2,6,8,5,3,7,9,1],
    [7,1,3,9,2,4,8,5,6],

    [9,6,1,5,3,7,2,8,4],
    [2,8,7,4,1,9,6,3,5],
    [3,4,5,2,8,6,1,7,9]

];


function createBoard() {

    const board =
        document.getElementById("sudoku");

    board.innerHTML = "";


    for(let row = 0; row < 9; row++) {

        for(let col = 0; col < 9; col++) {

            const input =
                document.createElement("input");

            input.className = "cell";

            input.type = "text";

            input.maxLength = 1;

            input.id =
                "cell-" + row + "-" + col;


            if(puzzle[row][col] !== 0) {

                input.value =
                    puzzle[row][col];

                input.readOnly = true;

                input.style.background =
                    "#334155";

                input.style.fontWeight =
                    "bold";

            }


            if(col === 2 || col === 5) {

                input.classList.add(
                    "right-border"
                );

            }


            if(row === 2 || row === 5) {

                input.classList.add(
                    "bottom-border"
                );

            }


            input.addEventListener(
                "input",
                function() {

                    this.value =
                        this.value.replace(
                            /[^1-9]/g,
                            ""
                        );

                }
            );


            board.appendChild(input);

        }

    }

}


function checkSudoku() {

    let correct = true;


    for(let row = 0; row < 9; row++) {

        for(let col = 0; col < 9; col++) {

            const input =
                document.getElementById(
                    "cell-" + row + "-" + col
                );


            const value =
                Number(input.value);


            if(value !== solution[row][col]) {

                correct = false;

            }

        }

    }


    const message =
        document.getElementById("message");


    if(correct) {

        message.innerHTML =
            "🎉 Excellent! Sudoku Completed!";

        message.style.color =
            "#22c55e";

    } else {

        message.innerHTML =
            "❌ Some answers are incorrect. Try again!";

        message.style.color =
            "#ef4444";

    }

}


function clearBoard() {

    for(let row = 0; row < 9; row++) {

        for(let col = 0; col < 9; col++) {

            if(puzzle[row][col] === 0) {

                document.getElementById(
                    "cell-" + row + "-" + col
                ).value = "";

            }

        }

    }


    document.getElementById(
        "message"
    ).innerHTML = "";

}


createBoard();

</script>

</body>

</html>
