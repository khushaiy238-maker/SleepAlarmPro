<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IT Word Scramble</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
        }

        .game-box {
            max-width: 650px;
            margin: 60px auto;
            padding: 40px;
            background: #1e293b;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 0 25px #38bdf8;
        }

        h1 {
            color: #38bdf8;
            font-weight: bold;
        }

        #scrambledWord {
            font-size: 42px;
            font-weight: bold;
            letter-spacing: 8px;
            color: #facc15;
            margin: 30px 0;
        }

        #answer {
            max-width: 400px;
            margin: auto;
            text-align: center;
            font-size: 20px;
        }

        #message {
            min-height: 30px;
            margin-top: 20px;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="game-box">

        <h1>🔤 IT Word Scramble</h1>

        <p class="text-secondary">
            Unscramble the technical word!
        </p>

        <div>

            Score:
            <strong id="score">0</strong>

            &nbsp;&nbsp;|&nbsp;&nbsp;

            Question:
            <strong id="questionNumber">1</strong>/10

        </div>

        <div id="scrambledWord">
            LOADING
        </div>

        <input
            type="text"
            id="answer"
            class="form-control"
            placeholder="Enter your answer"
            autocomplete="off"
        >

        <button
            onclick="checkAnswer()"
            class="btn btn-success btn-lg mt-3"
        >
            ✅ Check
        </button>

        <button
            onclick="nextWord()"
            class="btn btn-primary btn-lg mt-3"
        >
            ➡ Next
        </button>

        <div id="message"></div>

        <div class="mt-4">

            <a
                href="/games"
                class="btn btn-outline-light"
            >
                ⬅ Back to Games
            </a>

        </div>

    </div>

</div>


<script>

const words = [

    "PYTHON",
    "DATABASE",
    "ALGORITHM",
    "NETWORK",
    "COMPUTER",
    "JAVASCRIPT",
    "FLASK",
    "HTML",
    "SOFTWARE",
    "ARTIFICIAL"

];


let currentWord = 0;

let score = 0;

let answered = false;


function shuffleWord(word) {

    let letters = word.split("");

    for (let i = letters.length - 1; i > 0; i--) {

        let j = Math.floor(Math.random() * (i + 1));

        [letters[i], letters[j]] =
        [letters[j], letters[i]];

    }

    return letters.join("");

}


function loadWord() {

    if (currentWord >= words.length) {

        showFinalResult();

        return;

    }

    const word = words[currentWord];

    document.getElementById("scrambledWord").innerHTML =
        shuffleWord(word);

    document.getElementById("questionNumber").innerHTML =
        currentWord + 1;

    document.getElementById("answer").value = "";

    document.getElementById("message").innerHTML = "";

    answered = false;

}


function checkAnswer() {

    if (answered) {

        return;

    }

    const answer =
        document.getElementById("answer").value
        .trim()
        .toUpperCase();

    const correctAnswer = words[currentWord];

    const message =
        document.getElementById("message");


    if (answer === correctAnswer) {

        score++;

        document.getElementById("score").innerHTML =
            score;

        message.innerHTML =
            "🎉 Correct! Great job!";

        message.style.color =
            "#22c55e";

        answered = true;

    } else {

        message.innerHTML =
            "❌ Incorrect. Try again!";

        message.style.color =
            "#ef4444";

    }

}


function nextWord() {

    if (!answered) {

        document.getElementById("message").innerHTML =
            "⚠️ Answer the current word first.";

        document.getElementById("message").style.color =
            "#facc15";

        return;

    }

    currentWord++;

    loadWord();

}


function showFinalResult() {

    document.querySelector(".game-box").innerHTML = `

        <h1>🎉 Game Completed!</h1>

        <h2 class="mt-4">
            Your Score
        </h2>

        <h1>
            ${score} / ${words.length}
        </h1>

        <p class="mt-3">

            ${
                score >= 8
                ? "🏆 Excellent IT knowledge!"
                : score >= 5
                ? "👍 Good job! Keep learning!"
                : "📚 Keep practicing your IT skills!"
            }

        </p>

        <button
            onclick="location.reload()"
            class="btn btn-success mt-3"
        >
            🔄 Play Again
        </button>

        <a
            href="/games"
            class="btn btn-secondary mt-3"
        >
            ⬅ Back to Games
        </a>

    `;

}


document.getElementById("answer")
.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

        checkAnswer();

    }

});


loadWord();

</script>

</body>

</html>
